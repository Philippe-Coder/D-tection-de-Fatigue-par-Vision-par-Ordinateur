[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fatigue-guard"
version = "1.0.0"
description = "Détection de fatigue et de distraction par vision par ordinateur, 100 % locale."
readme = "README.md"
license = "MIT"
authors = [{ name = "Philippe-Coder" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "PySide6>=6.6",
    "rich>=13",
]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15"]
dev = ["pytest>=8"]

[project.scripts]
fatigue-guard = "fatigue_guard.cli:main"

[tool.setuptools.packages.find]
include = ["fatigue_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
